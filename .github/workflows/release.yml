name: Release
run-name: Release ${{ inputs.tag || 'latest' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional: leave blank to auto-detect latest upstream tag or commit)"
        required: false
        default: ""
      quiet:
        description: "Publish as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  publish:
    name: Build signed APKs and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # Free disk space without removing required Android SDK/NDK packages
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -a --volumes -f || true
          df -h

      # Checkout our repository to access workflow scripts and actions
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fetch latest changes directly from upstream WhiteDNS/WhiteAestherMobile
      - name: Sync latest code from upstream
        run: |
          git remote add upstream https://github.com/WhiteDNS/WhiteAestherMobile.git || true
          git fetch upstream --tags --force
          UPSTREAM_REF="upstream/main"
          if [ -n "${{ inputs.tag }}" ]; then
            UPSTREAM_REF="${{ inputs.tag }}"
          fi
          git checkout -B sync-upstream "$UPSTREAM_REF"

      # Install exact NDK versions needed by the Rust build tasks
      - name: Install Android NDKs
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV

      - uses: ./.github/actions/android-toolchain

      - name: Restore the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ANDROID_${name} is not set on this repository."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode \
            > "$RUNNER_TEMP/release.jks" 2>/dev/null || {
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
              exit 1
            }

          store_password="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:cntrl:]')"
          {
            echo "STORE_PASSWORD=${store_password}"
            echo "KEY_ALIAS_CLEAN=$(printf '%s' "$KEY_ALIAS" | tr -d '[:cntrl:]')"
            echo "KEY_PASSWORD_CLEAN=$(printf '%s' "$KEY_PASSWORD" | tr -d '[:cntrl:]')"
          } >> "$GITHUB_ENV"

          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$store_password" >/dev/null 2>&1; then
            echo "::error::The keystore did not open. Check ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi

      - name: Test the native bridge
        run: |
          cargo test --manifest-path native/aether/aether/Cargo.toml --locked --lib -- --test-threads=1
          cargo test --manifest-path native/android-bridge/Cargo.toml --locked

      # Grant executable permission to gradlew script
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and lint Android
        run: ./gradlew testStableDebugUnitTest lintStableRelease

      # Determine target version tag even if none was provided
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"

          # If no tag was provided, find the latest upstream tag or generate a fallback
          if [ -z "$tag" ]; then
            latest_tag=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || true)
            if [ -n "$latest_tag" ]; then
              tag="$latest_tag"
            else
              tag="v1.0.$(date +'%Y%m%d%H%M')"
            fi
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            name="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^preview-([0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+)$ ]]; then
            name="${BASH_REMATCH[1]}"
          else
            name="${tag#v}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Build the exit chain engine
        shell: pwsh
        run: |
          ./native/chain/setup.ps1
          ./native/chain/build.ps1

      - name: Fetch the Psiphon server list
        shell: pwsh
        run: ./native/psiphon/setup.ps1

      - name: Build the pluggable transports
        shell: pwsh
        run: |
          ./native/tor/setup.ps1
          ./native/tor/build.ps1

      # Build APKs and Bundle with JVM memory boundaries
      - name: Build signed APKs and bundle
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "-PWHITEAESTHER_VERSION_NAME=${{ steps.version.outputs.name }}"
            "-PWHITEAESTHER_VERSION_CODE=${{ steps.version.outputs.code }}"
            "-PWHITEAESTHER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            "-PWHITEAESTHER_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            "-PWHITEAESTHER_KEY_ALIAS=$KEY_ALIAS_CLEAN"
            "-PWHITEAESTHER_KEY_PASSWORD=$KEY_PASSWORD_CLEAN"
            "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
            "--no-daemon"
            "--stacktrace"
          )
          ./gradlew assembleStableRelease "${args[@]}"
          ./gradlew bundleStableRelease -PWHITEAESTHER_DISABLE_ABI_SPLITS=true "${args[@]}"

      - name: Verify signatures and collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          base="WhiteAestherMobile-${{ steps.version.outputs.name }}"
          apk_dir="app/build/outputs/apk/stable/release"
          signer="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="${apk_dir}/app-stable-${abi}-release.apk"
            test -f "$apk"
            "$signer" verify --verbose "$apk"
            python3 tools/verify_native_dependencies.py \
              --ndk "${ANDROID_HOME}/ndk/29.0.14206865" "$apk"
            jar tf "$apk" | grep -F "lib/${abi}/libwhiteaesther_core.so"
            test "$(jar tf "$apk" | grep -c '^lib/.*/libwhiteaesther_core\.so$')" -eq 1
            jar tf "$apk" | grep -F "lib/${abi}/libwhiteaestherchain.so"
            jar tf "$apk" | grep -F "lib/${abi}/libgojni.so"
            jar tf "$apk" | grep -qF "assets/psiphon_server_entries.txt"
            jar tf "$apk" | grep -F "lib/${abi}/libtor.so"
            jar tf "$apk" | grep -F "lib/${abi}/liblyrebird.so"
            jar tf "$apk" | grep -F "lib/${abi}/libsnowflake.so"
            test "$(jar tf "$apk" | grep -c '^lib/.*/libwhiteaestherchain\.so$')" -eq 1
            cp "$apk" "release-assets/${base}-${abi}.apk"
          done

          universal="${apk_dir}/app-stable-universal-release.apk"
          test -f "$universal"
          "$signer" verify --verbose "$universal"
          python3 tools/verify_native_dependencies.py \
            --ndk "${ANDROID_HOME}/ndk/29.0.14206865" "$universal"
          for lib in libwhiteaesther_core libwhiteaestherchain libgojni libtor liblyrebird libsnowflake; do
            test "$(jar tf "$universal" | grep -c "^lib/.*/${lib}\.so$")" -eq 3
          done
          jar tf "$universal" | grep -qF "assets/psiphon_server_entries.txt"

          dex="$(mktemp -d)"
          unzip -q -o -j "$universal" 'classes*.dex' -d "$dex"
          for name in torConfiguration org/torproject/jni/TorService ca/psiphon/PsiphonTunnel go/Seq; do
            if ! grep -qa -- "$name" "$dex"/classes*.dex; then
              echo "R8 removed or renamed $name -- see app/proguard-rules.pro" >&2
              exit 1
            fi
          done
          rm -rf "$dex"

          cp "$universal" "release-assets/${base}-universal.apk"

          aab="app/build/outputs/bundle/stableRelease/app-stable-release.aab"
          test -f "$aab"
          jarsigner -verify "$aab"
          python3 tools/verify_native_dependencies.py \
            --ndk "${ANDROID_HOME}/ndk/29.0.14206865" "$aab"
          for lib in libwhiteaesther_core libwhiteaestherchain libgojni libtor liblyrebird libsnowflake; do
            test "$(unzip -l "$aab" | grep -c "base/lib/.*/${lib}\.so$")" -eq 3
          done
          unzip -l "$aab" | grep -qF "psiphon_server_entries.txt"
          cp "$aab" "release-assets/${base}-bundle.aab"

          cd release-assets && sha256sum ./*.apk ./*.aab > SHA256SUMS

      # Ensure tag exists locally and publish/update the release on YOUR GitHub repository
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          # Create local git tag and push it to YOUR repo if missing
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag" || true
          fi

          quiet=""
          if [[ "${{ inputs.quiet }}" == "true" || "$tag" == preview-* || "${{ steps.version.outputs.name }}" == *-* ]]; then
            quiet="--prerelease --latest=false"
          fi

          # Target your repository explicitly using -R / --repo
          if gh release view "$tag" -R "$GH_REPO" >/dev/null 2>&1; then
            if [[ -n "$quiet" ]]; then
              gh release edit "$tag" -R "$GH_REPO" $quiet
            fi
            gh release upload "$tag" release-assets/* -R "$GH_REPO" --clobber
          else
            gh release create "$tag" release-assets/* \
              -R "$GH_REPO" --generate-notes --title "WhiteAestherMobile $tag" $quiet
          fi
